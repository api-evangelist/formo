name: Formo
description: 'Formo (Formo Foods GmbH) is a Berlin-based food-technology company producing
  animal-free dairy through precision fermentation and microbial fermentation of koji
  (Aspergillus oryzae). Instead of cows, Formo engineers microorganisms to make milk
  proteins such as casein, which it turns into real cheese and cream cheese products
  now sold across Germany and Austria. Founded by Raffael Wohlgensinger and backed
  by EQT Ventures, the company has received a US FDA "no questions" GRAS letter for
  its fermentation-derived casein. Formo is a consumer food producer and does not
  currently publish a public developer API.'
